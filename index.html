<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="top-text">
        <h1>Student Expense Tracker</h1>
        <p class="sub">Log what you spend, see where it goes.</p>
      </div>
      <div class="total-box" aria-live="polite">
        <span class="total-label" id="totalLabel">Total spent</span>
        <span class="total-amount" id="totalAmount">₹0.00</span>
      </div>
    </header>

    <section class="panel" aria-labelledby="addHeading">
      <h2 id="addHeading">Add an expense</h2>
      <form id="expenseForm" novalidate>
        <div class="field">
          <label for="name">Expense name</label>
          <input type="text" id="name" placeholder="e.g. Canteen lunch" maxlength="60" required autocomplete="off">
        </div>
        <div class="field">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button type="submit" id="addBtn">Add Expense</button>
      </form>
      <p id="error" class="error" role="alert" aria-live="assertive"></p>
    </section>

    <section class="panel" aria-labelledby="listHeading">
      <div class="list-head">
        <h2 id="listHeading">Your expenses</h2>
        <div class="filter">
          <label for="filter">Show</label>
          <select id="filter" aria-label="Filter expenses by category">
            <option value="All">All categories</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <ul id="expenseList" class="list" aria-live="polite"></ul>
      <p id="empty" class="empty">No expenses added yet. Enter a name, amount, and category above to get started!</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
